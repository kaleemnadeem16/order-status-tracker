name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: docker compose -p tracker-ci up -d --build --wait
      - run: docker compose -p tracker-ci exec -T app sh -c 'find . -path ./vendor -prune -o -name "*.php" -print0 | xargs -0 -n1 php -l'
      - run: docker compose -p tracker-ci exec -T app composer install --no-interaction --prefer-dist
      - run: docker compose -p tracker-ci exec -T app composer test
      - run: docker compose -p tracker-ci exec -T app php tests/http-smoke.php
      - if: always()
        run: docker compose -p tracker-ci down -v
